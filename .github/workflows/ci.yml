name: ci

on:
  push:
  pull_request:

jobs:
  native:
    name: native (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: serial
            flags: -DEVO_NO_OPENMP=ON
          - variant: openmp
            flags: ""
          - variant: thread-pool
            flags: -DEVO_POOL_THREADS=ON
    steps:
      - uses: actions/checkout@v7
      - name: Install SFML (window app)
        run: sudo apt-get update -q && sudo apt-get install -y -q libsfml-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.flags }}
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Engine identity (Codex #74 r1): a change to the engine must leave every existing path bit-identical.
  # The change's serial evo_boids and its base's (the merge base with main) run tools/identity_base_head.sh:
  # Classic, Stage A / B / C histories with a mid-run resume, and transplants from a Stage C and a Stage B
  # prey world (checkpoint and random sources, every assay mode), each arena then run; every checkpoint
  # (its RNG states included), arena, manifest and log must be byte-identical (the main CSV without its two
  # timing columns). Skipped when neither src/ nor CMakeLists.txt changed.
  identity:
    name: engine identity (base vs head, serial)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The base, and whether the engine changed
        id: base
        run: |
          git fetch -q origin main
          base=$(git merge-base HEAD origin/main)
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          if git diff --quiet "$base" HEAD -- src/ CMakeLists.txt; then c=no; else c=yes; fi
          echo "changed=$c" >> "$GITHUB_OUTPUT"
          echo "base $base, head $(git rev-parse HEAD), engine changed: $c"
      - name: Install SFML (the app target)
        if: steps.base.outputs.changed == 'yes'
        run: sudo apt-get update -q && sudo apt-get install -y -q libsfml-dev
      - name: Build the head and the base (serial, the same flags)
        if: steps.base.outputs.changed == 'yes'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DEVO_NO_OPENMP=ON
          cmake --build build --target evo_boids -j
          git worktree add -q --detach "$RUNNER_TEMP/base" "${{ steps.base.outputs.sha }}"
          cmake -S "$RUNNER_TEMP/base" -B "$RUNNER_TEMP/base/build" -DCMAKE_BUILD_TYPE=Release -DEVO_NO_OPENMP=ON
          cmake --build "$RUNNER_TEMP/base/build" --target evo_boids -j
          sha256sum build/evo_boids "$RUNNER_TEMP/base/build/evo_boids"
      - name: Compare every scenario's outputs (serial; with the registered production configuration)
        if: steps.base.outputs.changed == 'yes'
        env:
          ARENA: tests/redqueen_arena_selected.json
          EXPECT_ARENA_SHA256: 3efeab747a72150c24bcb541f84284691d4b45823cff45e95d71d8563fc8a838
        run: |
          bash tools/identity_base_head.sh "$RUNNER_TEMP/base/build/evo_boids" build/evo_boids "$RUNNER_TEMP/identity"
          sha256sum "$RUNNER_TEMP/identity/identity.json"
      # (Codex #74 r2) the PINNED production engine: finfolk e90cbf3 built with its recorded recipe, preset
      # native-serial-fast (the server's ~/finfolk/bin/evo_boids_fast, sha256 8d5cacbe...0d43, from that source and
      # preset: predC/sweep1 HOST.md), against the head built the same way, on every scenario including the
      # registered production configuration (arena #1, sha256 3efeab74..., both floors 0)
      - name: Build the pinned engine's source and the head with its recipe (native-serial-fast)
        if: steps.base.outputs.changed == 'yes'
        run: |
          grep -q -m1 avx2 /proc/cpuinfo && echo "the runner supports x86-64-v3"
          git worktree add -q --detach "$RUNNER_TEMP/pinned" e90cbf3
          (cd "$RUNNER_TEMP/pinned" && cmake --preset native-serial-fast > /dev/null && cmake --build --preset native-serial-fast --target evo_boids -j)
          cmake --preset native-serial-fast > /dev/null && cmake --build --preset native-serial-fast --target evo_boids -j
          sha256sum build_serial_fast/evo_boids "$RUNNER_TEMP/pinned/build_serial_fast/evo_boids"
      - name: Compare the pinned engine and the head (native-serial-fast; the production configuration included)
        if: steps.base.outputs.changed == 'yes'
        env:
          ARENA: tests/redqueen_arena_selected.json
          EXPECT_ARENA_SHA256: 3efeab747a72150c24bcb541f84284691d4b45823cff45e95d71d8563fc8a838
          PINNED_SOURCE: e90cbf3
          PINNED_PRESET: native-serial-fast
          PINNED_SHA256: 8d5cacbeedc506f09d88aeb90709649b58a21b60d201210961975e6e64370d43
        run: |
          bash tools/identity_base_head.sh "$RUNNER_TEMP/pinned/build_serial_fast/evo_boids" build_serial_fast/evo_boids "$RUNNER_TEMP/identity_pinned"
          sha256sum "$RUNNER_TEMP/identity_pinned/identity.json"

  # The web front end's type check: tsc --checkJs over tsconfig.json's files (those that
  # carry // @ts-check) with web/types.d.ts. Checking only, nothing is built: the runner
  # image's own node / npm, TypeScript from package.json's pin and package-lock.json's exact
  # tree (npm ci; the same commands run locally).
  web-types:
    name: web types (tsc --checkJs)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install tsc -p tsconfig.json

  # The fish programs' named slots and their assembler (web/ocean_shaders.js: program, feature, SLOTS):
  # the source-level contract, each assembly error with a planted mistake, the appends' order, and the
  # swim polish as a feature. Then the material binder over them (web/ocean_materials.js): its keys,
  # every drawn program against the scene digests, atomic activation and the plain fallback, each with
  # a planted failure. Then the scene on the real three bundle with a recording renderer (every frame's
  # draws against the bound variants, the session's committed digest, a context loss during the prewarm).
  # Node only (the runner image's own), no browser, no GLSL compiler.
  web-shader-slots:
    name: web shader slots (node)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # node pinned (the mock-three test imports the ES-module three bundle: node 20.19+ detects its syntax)
      - uses: actions/setup-node@v7
        with:
          node-version: "20.x"
      - run: node tests/ocean_shader_slots_tests.cjs
      - run: node tests/ocean_materials_tests.cjs
      - run: node tests/ocean_render_opt_tests.cjs
      - run: node tests/ocean_mock_three_tests.mjs
      # the render-perf tools' browser lock: interleavings of two contenders, then real processes at the same instant
      - run: node tests/ocean_render_perf_lock_tests.mjs

  # Both pages' shared UI (the UI parity plan, docs/ui_parity.md): web/ui_common.js's focus primitives
  # (key ownership, typing, keyboard / pointer presses, the tablists' roving focus, focus return), both
  # dashboards' tabs and Classic's setup sheet (web/renderer.js run whole) on a small DOM; then the paired
  # browser harness's parts that need no browser (tests/ui_parity_browser.mjs: the selection and fixture
  # checks, --compare as a gate on synthetic runs). The harness's browser runs are a local tool. Then the
  # fish card (P03): its shared parts against both pages' own drawing, gene counts and activation freshness
  # on both real modules, and both pages run whole with their modules (the card in every view, pause /
  # select / step, zero steps, a load, hiding the card without letting the fish go).
  web-ui:
    name: web ui (node)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20.x"
      - run: node tests/ui_common_tests.cjs
      - run: node tests/ui_parity_harness_tests.mjs
      - run: node tests/ui_inspector_tests.cjs

  # tools/redqueen (the Red Queen tournament tooling) on the Python versions it must run on: the
  # serial job's ctest runs it on the runner image's python3 (3.12); this job builds the serial app
  # only and runs the same unit + end-to-end tests on 3.14 (the study server's: its multiprocessing
  # default start method changed, so the runner uses plain subprocess workers) and the oldest 3.10.
  redqueen:
    name: redqueen tools (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install SFML (the app target)
        run: sudo apt-get update -q && sudo apt-get install -y -q libsfml-dev
      - name: Build the serial app
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DEVO_NO_OPENMP=ON
          cmake --build build --target evo_boids -j
      - name: Unit tests
        # (a leaked file handle is a failure: ResourceWarning as an error, and none in the output)
        run: |
          python3 -I -W error::ResourceWarning tools/redqueen/test_redqueen.py -v 2>&1 | tee unit.log
          test "${PIPESTATUS[0]}" = 0
          ! grep -q ResourceWarning unit.log
      - name: Map graph and recovery simulation (numpy required)
        run: |
          python3 -m pip install -q "numpy>=2"
          RQ_REQUIRE_NUMPY=1 python3 -I -W error::ResourceWarning tools/redqueen/test_graph.py -v 2>&1 | tee graph.log
          test "${PIPESTATUS[0]}" = 0
          ! grep -q ResourceWarning graph.log
          ! grep -q "skipped" graph.log
      - name: End to end (10 workers)
        run: PYTHON=python3 RQ_TEST_WORKERS=10 bash tests/redqueen_tooling.sh build/evo_boids "$RUNNER_TEMP/rq_work"
      - name: Histories (worlds.py, end to end; its unit tests first)
        run: PYTHON=python3 bash tests/redqueen_worlds.sh build/evo_boids "$RUNNER_TEMP/rq_worlds"
      - name: Fork branches (forks.py, end to end; its unit tests first)
        run: PYTHON=python3 bash tests/redqueen_forks.sh build/evo_boids "$RUNNER_TEMP/rq_forks"
      - name: Sealing (split manifest, filters, prediction commitments, public freeze)
        run: |
          python3 -I -W error::ResourceWarning tools/redqueen/test_sealing.py -v 2>&1 | tee sealing.log
          test "${PIPESTATUS[0]}" = 0
          ! grep -q ResourceWarning sealing.log
      - name: "The shared evidence-chain rule (evidence.py: val_block.py and worlds.py's ecology)"
        run: |
          python3 -I -W error::ResourceWarning tools/redqueen/test_evidence.py -v 2>&1 | tee evidence.log
          test "${PIPESTATUS[0]}" = 0
          ! grep -q ResourceWarning evidence.log
      - name: "Validation-layout adapter (val_block.py, the runner_val worlds block)"
        run: |
          python3 -I -W error::ResourceWarning tools/redqueen/test_val_block.py -v 2>&1 | tee val_block.log
          test "${PIPESTATUS[0]}" = 0
          ! grep -q ResourceWarning val_block.log
      - name: "Reference selection (refsel.py, design v4 section 4.2; numpy required)"
        run: |
          python3 -m pip install -q "numpy>=2"
          RQ_REQUIRE_NUMPY=1 python3 -I -W error::ResourceWarning tools/redqueen/test_refsel.py -v 2>&1 | tee refsel.log
          test "${PIPESTATUS[0]}" = 0
          ! grep -q ResourceWarning refsel.log
          ! grep -q "skipped" refsel.log
      - name: "Noise bank (noisebank.py, design v4 section 7.4; numpy required)"
        run: |
          python3 -m pip install -q "numpy>=2"
          RQ_REQUIRE_NUMPY=1 python3 -I -W error::ResourceWarning tools/redqueen/test_noisebank.py -v 2>&1 | tee noisebank.log
          test "${PIPESTATUS[0]}" = 0
          ! grep -q ResourceWarning noisebank.log
          ! grep -q "skipped" noisebank.log
      - name: "Linear forecasts (forecast.py, design v4 section 10.6; numpy required)"
        run: |
          python3 -m pip install -q "numpy>=2"
          RQ_REQUIRE_NUMPY=1 python3 -I -W error::ResourceWarning tools/redqueen/test_forecast.py -v 2>&1 | tee test_forecast.log
          test "${PIPESTATUS[0]}" = 0
          ! grep -q ResourceWarning test_forecast.log
          ! grep -q "skipped" test_forecast.log
      - name: "Level-3 probes (probes.py, design v4 section 11; numpy required)"
        run: |
          python3 -m pip install -q "numpy>=2"
          RQ_REQUIRE_NUMPY=1 python3 -I -W error::ResourceWarning tools/redqueen/test_probes.py -v 2>&1 | tee test_probes.log
          test "${PIPESTATUS[0]}" = 0
          ! grep -q ResourceWarning test_probes.log
          ! grep -q "skipped" test_probes.log

  # tools/gate_receipts.*: fault suite on temp repos and fake tools (no Emscripten, no gate reuse in CI).
  receipts:
    name: gate receipts (fault suite)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 -I tests/test_gate_receipts.py

  wasm:
    name: wasm (build, freshness, parity)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: mymindstorm/setup-emsdk@v16
        with:
          actions-cache-folder: emsdk-cache
          # The version the committed web/*.wasm were built with; the
          # freshness check below only means something with the same one.
          version: 6.0.4
      - name: Build both browser modules
        run: bash wasm/build_wasm.sh
      - name: Committed modules match the sources
        run: |
          if ! git diff --quiet -- web/; then
            git status --short web/
            echo "::error::web/*.js / *.wasm are stale: run wasm/build_wasm.sh and commit the result"
            exit 1
          fi
      - name: Native serial == wasm, bit for bit
        run: bash wasm/parity.sh
      - name: Static site assembles
        run: bash wasm/build_site.sh

  # The Ocean (3-D) world: its browser module rebuilt and compared with the
  # committed one; the page's Turbo hand-off against that module (two real
  # instances, in node); then wasm/ocean_parity.sh on CI's FAST subset (49 of
  # the 124 cases: one or more of every family,
  # and the appearance twins of the selected ones) with every guard (the
  # page's validation of each case, the refused configs, the removed-non-finite
  # runs, the preset / int-key / bool-key / orphan checks) and the unit checks,
  # native and wasm, plain and eye builds. The whole matrix runs in
  # .github/workflows/ocean-full.yml (weekly, and on demand).
  ocean:
    name: ocean (module freshness, unit checks, parity subset)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: mymindstorm/setup-emsdk@v16
        with:
          actions-cache-folder: emsdk-cache
          # The version the committed web/evo_ocean.wasm was built with.
          version: 6.0.4
      - name: Build the Ocean module
        run: bash wasm/build_ocean.sh
      - name: Committed Ocean module matches the sources
        run: |
          if ! git diff --quiet -- web/evo_ocean.js web/evo_ocean.wasm; then
            git status --short web/
            echo "::error::web/evo_ocean.js / .wasm are stale: run wasm/build_ocean.sh and commit the result"
            exit 1
          fi
      - name: The page's Turbo hand-off (node, two real modules)
        run: node tests/ocean_turbo_handoff.js
      - name: The appearance fish's gene slots (node)
        run: node tests/ocean_appearance_slots_tests.cjs
      - name: Ocean parity (FAST subset), guards and unit checks
        run: FAST=1 JOBS=$(nproc) bash wasm/ocean_parity.sh
      # The appearance-off twin of the live-knob case, as the weekly
      # APP_TWINS=all run makes it (its live `appearance` no-op must become
      # appearance=0 in the twin; the live-code audit of PRs #22-#25, finding 1).
      # The unit checks and the eye build already ran in the step above.
      - name: Ocean appearance twin of app_live_s21
        run: APP_TWINS=all ONLY=app_live_s21 NO_TESTS=1 NO_EYE=1 bash wasm/ocean_parity.sh
